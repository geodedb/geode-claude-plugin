include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: release

workflow:
  # An open MR owns push validation; keep schedules, API, trigger,
  # parent pipelines, tags and manual runs admitted as before.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always
  # SRE-172: a newer commit on the same ref cancels the superseded pipeline's
  # interruptible (validation) jobs. Release/deploy jobs stay non-interruptible.
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible

default:
  tags:
    - company
    - linux

stages:
  - validate
  - test
  - integration
  - security
  - sbom
  - release

variables:
  GIT_DEPTH: 1

# Validate JSON files
validate-json:
  interruptible: true
  stage: validate
  image: python:3.15-slim
  script:
    - |
      echo "Validating JSON files..."
      for file in $(find . -name "*.json" -type f); do
        echo "Checking $file..."
        python -m json.tool "$file" > /dev/null || exit 1
      done
      echo "All JSON files are valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Validate MCP and LSP configuration schema (GAP-0005)
validate-config-schema:
  interruptible: true
  stage: validate
  image: alpine:latest
  script:
    - apk add --no-cache jq
    - |
      echo "Validating .mcp.json schema..."
      # Check mcpServers object exists and has required fields
      jq -e '.mcpServers | keys[] as $k | .[$k] | has("command") and (.args | type == "array")' .mcp.json > /dev/null || {
        echo "ERROR: .mcp.json missing required fields (mcpServers with command and args array)"
        exit 1
      }
      echo ".mcp.json schema is valid!"

      echo "Validating .lsp.json schema..."
      # Check LSP config has command field
      jq -e 'keys[] as $k | .[$k] | has("command")' .lsp.json > /dev/null || {
        echo "ERROR: .lsp.json missing required fields (language config with command)"
        exit 1
      }
      echo ".lsp.json schema is valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Validate shell scripts
validate-shell:
  interruptible: true
  stage: validate
  image: koalaman/shellcheck-alpine:stable
  script:
    - |
      echo "Validating shell scripts..."
      find . -name "*.sh" -type f -exec shellcheck {} \;
      echo "All shell scripts are valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Check markdown files
validate-markdown:
  interruptible: true
  stage: validate
  image: node:26-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: linux-node-26-markdownlint
    paths: [.npm/]
  script:
    - npm install -g markdownlint-cli
    - |
      echo "Checking markdown files..."
      markdownlint '**/*.md' --ignore node_modules || true
      echo "Markdown check complete!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Test plugin structure (GAP-0001: includes .mcp.json)
test-structure:
  interruptible: true
  stage: test
  image: alpine:latest
  script:
    - |
      echo "Checking plugin structure..."

      # Required files
      test -f ".claude-plugin/plugin.json" || { echo "Missing .claude-plugin/plugin.json"; exit 1; }
      test -f ".lsp.json" || { echo "Missing .lsp.json"; exit 1; }
      test -f ".mcp.json" || { echo "Missing .mcp.json"; exit 1; }
      test -f "hooks/hooks.json" || { echo "Missing hooks/hooks.json"; exit 1; }
      test -f "hooks/check-geode.sh" || { echo "Missing hooks/check-geode.sh"; exit 1; }
      test -d "commands" || { echo "Missing commands directory"; exit 1; }

      echo "Plugin structure is valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test hook script execution
test-hooks:
  interruptible: true
  stage: test
  image: bash:5
  script:
    - |
      echo "Testing hook scripts..."

      # Check that hook script is executable syntax
      bash -n hooks/check-geode.sh || { echo "Hook script has syntax errors"; exit 1; }

      echo "Hook scripts are valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration test with geode binary (GAP-0004)
# This job requires the geode binary to be available
# Uses the geode container image from the main geode project
test-integration:
  interruptible: true
  stage: integration
  image:
    name: geodedb/geode:latest
    entrypoint: [""]
  script:
    - |
      echo "Testing geode LSP command..."
      geode lsp --help || { echo "ERROR: geode lsp command failed"; exit 1; }
      echo "LSP command OK!"

      echo "Testing geode MCP command..."
      geode mcp --help || { echo "ERROR: geode mcp command failed"; exit 1; }
      echo "MCP command OK!"

      echo "Testing MCP server initialization..."
      # Send initialize request and verify response
      echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | \
        timeout 5 geode mcp serve 2>/dev/null | head -1 | grep -q '"result"' || {
          echo "WARNING: MCP server initialization test inconclusive (may need running server)"
        }

      echo "Integration tests completed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true  # Allow failure until container image is published
